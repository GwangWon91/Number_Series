# SKCT 수열추리 출제 공통 설정
# - 값을 바꾸면 version을 1 올리고 changelog에 이유를 남긴다.
# - 근거 수준: [확실] 커뮤니티 다수 일치 / [추정] 확인 필요 / [모름]
version: 4

exam:
  choices: 5                # [추정: 비공개 기출 분석] 5지선다
  choiceOrder: random       # [추정: 비공개 기출 분석] 대부분 정렬 안 됨
  timePerItemSec: 45        # [확실] 20문항 / 15분
  bankRatio: 0.2            # 문제은행(public) 문항 출제 비율
  difficultyMix: { "1": 0.3, "2": 0.5, "3": 0.2 }   # [추정]
  avoidRecent: 200          # 최근 N문항과 같은 문항은 다시 내지 않음
  distractors:              # 오답 선택지 전략 가중치 [추정]
    near: 3
    step: 3
    mistake: 2
    digit: 1
  questions:                # 묻는 방식 [추정: 비공개 기출 분석]
    kinds: { blank: 0.6, pair: 0.25, nth: 0.15 }
    pairOps: { "+": 3, "−": 2, "×": 2, "/": 3 }   # [추정: 비공개 기출 분석]
    pairExtraLength: 1      # 빈칸이 하나 더 있으므로 항 +1 (실전 A·B 문항 7~10항)
    nthAhead: [1, 4]        # [추정: 비공개 기출 분석] 보이는 항 뒤 1~4항

validation:
  minRedundancy: 2          # 정답 규칙이 확정되려면 남는 확인용 항이 최소 2개
  altMinRedundancy: 1       # 확인용 항이 1개라도 있는 다른 해석은 "다른 정답"으로 간주
  maxRetries: 300
  sampleSizePerType: 400    # validate가 유형마다 생성해 보는 문항 수
  maxDuplicateRate: 0.15    # 샘플 내 중복 문항 허용 비율
  minSuccessRate: 0.98      # maxRetries 안에 문항을 만들어 내야 하는 비율

feedback:
  reasons:                  # '실전과 다름' 사유 칩
    - { id: numbers-too-big, label: 숫자가 너무 큼 }
    - { id: numbers-too-small, label: 숫자가 너무 작음 }
    - { id: unfamiliar-rule, label: 실전에 없는 규칙 }
    - { id: too-easy, label: 실전보다 쉬움 }
    - { id: too-hard, label: 실전보다 어려움 }
    - { id: odd-choices, label: 선택지가 어색함 }
    - { id: wrong-length, label: 항 개수가 다름 }
    - { id: other, label: 기타 }

changelog:
  - { version: 1, date: "2026-10-07", note: "초기 추정값으로 시작 (기출 자료 확보 전)" }
  - { version: 2, date: "2026-10-07", note: "기출 복원 문항 반영: 선택지 무작위 순서, 분수 비중·중간 빈칸 증가, 근거 유형 표시" }
  - { version: 3, date: "2026-10-07", note: "기출 복원 문항 추가 반영: A·B 두 빈칸·n번째 항 문항, 유리수 유형(분수·소수·대분수) 추가, 분수 비중 12→58" }
  - { version: 4, date: "2026-10-08", note: "기출 유형 비중에 맞춤(weight 합 100으로 다시 매김), 유리수 생성기에 계차 등비·2단계 계차 등비·두 연산 번갈아 추가, 홀짝 교대 8항부터, 피보나치형 곱 비중↑·범위 확대, 유리수 범위 확대, n번째 항 이어 쓰기 판정 수정" }
