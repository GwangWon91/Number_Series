# main에 커밋이 쌓이면 release-please가 "릴리스 PR"(CHANGELOG·버전 갱신)을 열어 둔다.
# 그 PR을 병합하면 vX.Y.Z 태그 + GitHub Release가 만들어지고, 바로 GitHub Pages로 배포한다.
# (기본 토큰으로 만든 Release는 다른 워크플로를 깨우지 않으므로 배포는 여기서 직접 호출)
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  deploy:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
