# PR과 main push마다 품질 게이트. main 보호 규칙에서 이 job을 "필수 통과"로 건다.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  # 기본 토큰이 만든 릴리스 PR에는 pull_request 이벤트가 안 올 수 있어 scripts/ship.sh가 직접 실행한다
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate
      - run: npm run build
